<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="style.css">
<style>
html, body { margin: 0; width: 1600px; height: 500px; overflow: hidden; background: #6fb4ff; }
.scene { position: absolute; inset: 0; }
.scene svg { width: 100%; height: 100%; display: block; }
.clouds { position: absolute; inset: 0; }
.left { position: absolute; left: 90px; top: 70px; color: #fff; }
.left .row { display: flex; gap: 22px; align-items: center; }
.left img { width: 120px; height: 120px; image-rendering: pixelated; filter: drop-shadow(6px 6px 0 rgba(0,0,0,.35)); }
.left h1 { font: 400 112px Pixel, monospace; margin: 0; letter-spacing: 2px; text-shadow: 7px 7px 0 #3f3f3f; line-height: 1; }
.left p { font: 700 30px system-ui, "Segoe UI", sans-serif; margin: 22px 0 26px; text-shadow: 3px 3px 0 rgba(0,0,0,.45); }
.chips { display: flex; gap: 12px; }
.chips span { font: 20px Pixel, monospace; color: #fff; background: #6d6d6d; border: 3px solid #000; padding: 8px 14px;
  box-shadow: inset 3px 3px 0 #a9a9a9, inset -3px -4px 0 #3d3d3d; text-shadow: 2px 2px 0 #3f3f3f; }
.chips span.g { background: #3f8f2a; box-shadow: inset 3px 3px 0 #7fd15e, inset -3px -4px 0 #26591a; }
.mock { position: absolute; right: 80px; top: 64px; width: 470px; }
.mock .tile.hero-tile { animation: none; }
.mock .tiles { margin: 0; }
.mock .lbcard { margin-top: 14px; padding: 14px 16px; background: #25272d; border: 3px solid #000; box-shadow: inset 3px 3px 0 #3b3e46, inset -3px -3px 0 #0e0f12; color: #f1efe8; }
.mock .lbcard h3 { margin: 0 0 8px; font: 500 20px Pixel, monospace; display: flex; gap: 8px; align-items: center; }
.mock .lbcard li { animation: none; }
.mock .lb-list li:nth-child(n+4) { display: none; }
</style></head>
<body>
<div class="scene" id="scene"></div><div class="clouds" id="clouds"></div>
<div class="left">
  <div class="row"><img src="favicon.svg" alt=""><h1>PlayChrono</h1></div>
  <p>Your Minecraft playtime, measured.</p>
  <div class="chips"><span class="g">Fabric · Forge · NeoForge · Quilt</span><span>1.20 → 26.3</span><span>Leaderboard</span></div>
</div>
<div class="mock">
  <div class="tiles"><div class="tile hero-tile"><span class="slot" id="i1"></span><span class="txt"><span class="lbl">Active play time</span>
    <span class="val">128 h</span><span class="xp"><i style="width:62%"></i></span><span class="xp-level">Level 128 · 23 min to level 129</span></span></div></div>
  <div class="lbcard"><h3 id="i2">Leaderboard</h3><ol class="lb-list" id="lb"></ol></div>
</div>
<script src="icons.js"></script>
<script>
document.getElementById('scene').innerHTML = PPIcons.landscape(160, false);
document.getElementById('clouds').innerHTML = PPIcons.clouds(160, false);
document.getElementById('i1').innerHTML = PPIcons.svg('grass', 36);
document.getElementById('i2').insertAdjacentHTML('afterbegin', PPIcons.svg('trophy', 24));
var rows = [['Blockwright', '428 h'], ['MossyCobble', '383 h'], ['NetherNomad', '382 h']];
document.getElementById('lb').innerHTML = rows.map(function (r, i) {
  return '<li><span class="rank">' + (i + 1) + '</span>' + PPIcons.avatar(r[0], 22) + '<span class="name">' + r[0] + '</span><span class="lb-value">' + r[1] + '</span></li>';
}).join('');
</script>
</body></html>
