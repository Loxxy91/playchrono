# Single source of truth for the mod metadata. Build.java writes fabric.mod.json, META-INF/mods.toml and
# META-INF/neoforge.mods.toml from these values. Change them here, never in the generated files.
id=playchrono
name=PlayChrono
version=1.0.0
authors=Loxxy91
homepage=https://modrinth.com/mod/playchrono
sources=https://github.com/Loxxy91/playchrono
issues=https://github.com/Loxxy91/playchrono/issues
license=GPL-3.0-only
description=Your Minecraft playtime, measured: active vs AFK time, daily schedules, servers, worlds, versions, menus, movement, inputs and more. Private by default, local web dashboard (F8). One jar for Fabric, Quilt, Forge and NeoForge, Minecraft 1.20 to 26.x.
minecraft=1.20
# Public leaderboard server (HTTPS). Baked into the jar as the default
# leaderboard.url. Empty = the Leaderboard tab only shows the player's own records.
leaderboardUrl=
